[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "bounded-geological-residual-fusion"
version = "1.0.0"
description = "Bounded geological residual fusion for hyperspectral prospectivity modelling"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "torch>=2.1,<3", "scikit-learn>=1.3,<2"]
[tool.setuptools.packages.find]
include = ["georesidual*"]
